<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intranet 88044</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <!-- Logo -->
            <div class="logo-container">
                <img
                    src="img/brand/escudo.png"
                    alt="Escudo de la institución educativa"
                    class="logo"
                >
            </div>

            <!-- Encabezado -->
            <div class="login-header">
                <span class="institution">IE 88044</span>

                <h1>Bienvenido</h1>

                <p>
                    Intranet de Gestión Documental
                </p>
            </div>

            <!-- Formulario -->
            <form
                action="backend/auth/login.php"
                method="POST"
                class="login-form"
            >

                <div class="form-group">

                    <label for="correo">
                        Correo institucional
                    </label>

                    <div class="input-container">
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="usuario@ie88044.edu.pe"
                            autocomplete="email"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        Contraseña
                    </label>

                    <div class="input-container">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            name="recordar"
                        >

                        <span>Recordarme</span>
                    </label>

                    <a href="#" class="forgot-password">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-login"
                >
                    <span>Iniciar sesión</span>
                    <span class="arrow">→</span>
                </button>

            </form>


            <!-- Pie -->
            <div class="login-footer">

                <p>
                    Sistema exclusivo para personal autorizado
                </p>

                <span>
                    © 2026 IE 88044
                </span>

            </div>

        </section>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";

            } else {

                password.type = "password";
                button.textContent = "👁";

            }

        }

    </script>

</body>

</html>

<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Intranet · I.E.P. 88044 Abraham Valdelomar</title>

    <link rel="stylesheet" href="css/styles.css">
</head>

<body class="login-page login-tech">

    <main class="login-container login-container--split">

        <!-- Fondo digital generado solo con CSS (líneas, puntos y resplandores
             sutiles en tonos institucionales). No usa imágenes externas. -->
        <div class="login-bg-digital" aria-hidden="true"></div>

        <div class="login-shell">

            <!-- Costado de identidad institucional -->
            <aside class="login-brand-panel">

                <div class="logo-container">
                    <img
                        src="img/brand/INICIO.png"
                        alt="Escudo de la institución educativa"
                        class="logo"
                    >
                </div>

                <div class="login-brand">
                    <span class="login-brand-title">ABRAHAM VALDELOMAR</span>
                    <span class="login-brand-sub">I.E.P. N&deg; 88044</span>
                    <span class="login-brand-desc">INTRANET INSTITUCIONAL </span>
                </div>

            </aside>

            <!-- Costado del formulario de acceso -->
            <section class="login-card">

<div class="login-card-eyebrow">
    <span class="login-card-eyebrow-icon" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
            <circle cx="12" cy="12" r="9"></circle>
            <path d="M3 12h18"></path>
            <path d="M12 3c2.5 2.5 3.8 5.5 3.8 9S14.5 18.5 12 21"></path>
            <path d="M12 3c-2.5 2.5-3.8 5.5-3.8 9S9.5 18.5 12 21"></path>
        </svg>
    </span>

    <span class="login-card-eyebrow-text">Intranet</span>
</div>

                <!-- Mensaje de error (se muestra solo si el backend redirige con ?error=) -->
                <p class="login-error" id="loginError" role="alert" hidden></p>

            <!-- Formulario -->
            <form
                action="backend/auth/login.php"
                method="POST"
                class="login-form"
                id="loginForm"
            >

                <div class="form-group">

                    <label for="correo">
                        USUARIO
                    </label>

                    <div class="input-container">
                        <span class="input-icon">✉</span>

                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            placeholder="usuario@ie88044.edu.pe"
                            autocomplete="email"
                            required
                        >
                    </div>

                </div>


                <div class="form-group">

                    <label for="password">
                        CLAVE
                    </label>

                    <div class="input-container">
                        <span class="input-icon">🔒</span>

                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Ingresa tu contraseña"
                            autocomplete="current-password"
                            required
                        >

                        <button
                            type="button"
                            class="show-password"
                            onclick="togglePassword()"
                            aria-label="Mostrar contraseña"
                        >
                            👁
                        </button>

                    </div>

                </div>


                <div class="form-options">

                    <label class="remember">
                        <input
                            type="checkbox"
                            name="recordar"
                        >

                        <span>Recordarme</span>
                    </label>

                    <a href="recuperar-contrasena.html" class="forgot-password">
                        ¿Olvidaste tu contraseña?
                    </a>

                </div>


                <button
                    type="submit"
                    class="btn-login"
                    id="btnLogin"
                >
                    <span class="btn-login-label">Ingresar</span>
                    <span class="arrow">→</span>
                </button>

            </form>


                <!-- Pie -->
                <div class="login-footer">

                    <p>
                        Sistema exclusivo para personal autorizado
                    </p>

                    <span>
                        © 2026 I.E.P. 88044 ABRAHAM VALDELOMAR 
                    </span>

                </div>

            </section>

        </div>

    </main>


    <script>

        function togglePassword() {

            const password =
                document.getElementById("password");

            const button =
                document.querySelector(".show-password");

            if (password.type === "password") {

                password.type = "text";
                button.textContent = "🙈";

            } else {

                password.type = "password";
                button.textContent = "👁";

            }

        }

        // ==========================================
        // Mensaje de error enviado por backend/auth/login.php
        // (login.php redirige aquí con ?error=mensaje cuando
        // el correo, la contraseña o el estado del usuario no
        // son válidos; no cambia la lógica de autenticación,
        // solo cómo se muestra el mensaje).
        // ==========================================
        (function mostrarErrorSiExiste() {
            const params = new URLSearchParams(window.location.search);
            const mensaje = params.get("error");
            const errorBox = document.getElementById("loginError");

            if (mensaje && errorBox) {
                errorBox.textContent = mensaje;
                errorBox.hidden = false;
            }
        })();

        // ==========================================
        // Estado de carga del botón "Ingresar" mientras
        // el navegador envía el formulario (no interfiere
        // con el envío real ni con la validación existente).
        // ==========================================
        (function estadoCargaLogin() {
            const form = document.getElementById("loginForm");
            const btn = document.getElementById("btnLogin");
            if (!form || !btn) return;

            form.addEventListener("submit", () => {
                if (!form.checkValidity()) return; // deja que el navegador muestre los campos requeridos
                btn.disabled = true;
                btn.classList.add("is-loading");
                const label = btn.querySelector(".btn-login-label");
                if (label) label.textContent = "Ingresando...";
            });
        })();

    </script>

</body>

</html>
